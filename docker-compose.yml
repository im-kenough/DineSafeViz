name: dsv

# Read-only app-role DB connection, shared by dsv-app and dsv-analytics.
x-db-app-env: &db-app-env
  DSV_DB_HOST: dsv-db
  DSV_DB_PORT: ${DSV_DB_PORT}
  DSV_DB_NAME: ${DSV_DB_NAME}
  DSV_DB_USER: ${DSV_DB_APP_USER:-dinesafe_app}
  DSV_DB_PASSWORD: ${DSV_DB_APP_PASSWORD:-dinesafe_app}

services:
  dsv-nginx:
    image: nginx:1.31.6-alpine
    ports:
      - "8080:80"
    volumes:
      - ./src/dsv-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      dsv-app:
        condition: service_healthy
      dsv-analytics:
        condition: service_healthy

  dsv-app:
    build: ./src/dsv-app
    environment: *db-app-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      dsv-db:
        condition: service_healthy

  dsv-db:
    image: postgres:17.10
    environment:
      POSTGRES_USER: ${DSV_DB_USER}
      POSTGRES_PASSWORD: ${DSV_DB_PASSWORD}
      POSTGRES_DB: ${DSV_DB_NAME}
      # Read once by set-passwords.sh on first start. Defaults match the
      # app-role defaults in x-db-app-env.
      DSV_DB_APP_PASSWORD: ${DSV_DB_APP_PASSWORD:-dinesafe_app}
      DSV_DB_MIGRATOR_PASSWORD: ${DSV_DB_MIGRATOR_PASSWORD:-dinesafe_migrator}
    volumes:
      - dsv-db-data:/var/lib/postgresql/data
      - ./src/dsv-db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./src/dsv-db/set-passwords.sh:/docker-entrypoint-initdb.d/set-passwords.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DSV_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  dsv-init-db:
    build: ./src/dsv-db
    environment:
      DSV_DB_HOST: dsv-db
      DSV_DB_PORT: ${DSV_DB_PORT}
      DSV_DB_NAME: ${DSV_DB_NAME}
      DSV_DB_USER: ${DSV_DB_USER}
      DSV_DB_PASSWORD: ${DSV_DB_PASSWORD}
      DSV_DATA_DIR: /data
    # Mirror of the Blob container. scripts/data.sh fills it.
    volumes:
      - ./data:/data:ro
    depends_on:
      dsv-db:
        condition: service_healthy
    restart: "no"

  # Toronto Open Data -> Blob -> ./data. Same image as dsv-init-db, but no
  # DB credentials. Runs only through scripts/data.sh, which mounts the
  # storage token and passes the command (fetch or sync).
  dsv-data:
    build: ./src/dsv-db
    profiles: [data]
    entrypoint: ["python3", "data.py"]
    environment:
      DSV_DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: "no"

  dsv-analytics:
    image: grafana/grafana:13.2
    ports:
      - "3000:3000"
    environment:
      GF_SERVER_ROOT_URL: ${DSV_ANALYTICS_ROOT_URL:-http://localhost:8080/analytics/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${DSV_ANALYTICS_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${DSV_ANALYTICS_ADMIN_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/dinesafe.json
      <<: *db-app-env
    volumes:
      - ./src/dsv-analytics/provisioning:/etc/grafana/provisioning
      - dsv-analytics-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/analytics/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
    depends_on:
      dsv-db:
        condition: service_healthy

  dsv-init-analytics:
    image: curlimages/curl:8.22.0
    depends_on:
      dsv-analytics:
        condition: service_healthy
    environment:
      DSV_ANALYTICS_ADMIN_USER: ${DSV_ANALYTICS_ADMIN_USER}
      DSV_ANALYTICS_ADMIN_PASSWORD: ${DSV_ANALYTICS_ADMIN_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        STATUS=$$(curl -s -o /dev/null -w '%{http_code}' "http://$$DSV_ANALYTICS_ADMIN_USER:$$DSV_ANALYTICS_ADMIN_PASSWORD@dsv-analytics:3000/analytics/api/dashboards/uid/dinesafe")
        [ "$$STATUS" != "200" ] && echo "Dashboard not found, skipping permissions grant" && exit 0
        curl -sf -X POST "http://$$DSV_ANALYTICS_ADMIN_USER:$$DSV_ANALYTICS_ADMIN_PASSWORD@dsv-analytics:3000/analytics/api/dashboards/uid/dinesafe/permissions" -H "Content-Type: application/json" -d '{"items":[{"role":"Viewer","permission":1}]}'
    restart: "no"

volumes:
  dsv-db-data:
  dsv-analytics-data:
