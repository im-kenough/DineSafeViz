name: dsv

# Where the database is, shared by every service that connects to it.
# Postgres's default port. dsv-db publishes no ports, so only containers on
# the stack's network can reach it, and changing the port would gain nothing.
x-db-env: &db-env
  DSV_DB_HOST: dsv-db
  DSV_DB_PORT: "5432"
  DSV_DB_NAME: ${DSV_DB_NAME}

# Read-only app-role DB connection, shared by dsv-app and dsv-analytics.
x-db-app-env: &db-app-env
  <<: *db-env
  DSV_DB_USER: ${DSV_DB_APP_USER:-dinesafe_app}
  DSV_DB_PASSWORD: ${DSV_DB_APP_PASSWORD:-dinesafe_app}

services:
  dsv-nginx:
    image: nginx:1.31.7-alpine-slim@sha256:ebd058041a732a2b2dc0b606e34572dd8e0034de6a4aa4d50d8c13a240ac6005
    ports:
      - "8080:80"
    volumes:
      - ./src/dsv-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      dsv-app:
        condition: service_healthy
      dsv-analytics:
        condition: service_healthy

  dsv-app:
    build: ./src/dsv-app
    environment: *db-app-env
    healthcheck:
      # busybox wget, not python -c: no interpreter cold start every 5s.
      # 127.0.0.1, not localhost: busybox wget tries only ::1, and gunicorn
      # binds IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      dsv-db:
        condition: service_healthy

  dsv-db:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${DSV_DB_USER}
      POSTGRES_PASSWORD: ${DSV_DB_PASSWORD}
      POSTGRES_DB: ${DSV_DB_NAME}
      # Read once by set-passwords.sh on first start. Defaults match the
      # app-role defaults in x-db-app-env.
      DSV_DB_APP_PASSWORD: ${DSV_DB_APP_PASSWORD:-dinesafe_app}
      DSV_DB_MIGRATOR_PASSWORD: ${DSV_DB_MIGRATOR_PASSWORD:-dinesafe_migrator}
    volumes:
      # 18+ images keep PGDATA in a versioned subdirectory
      # (/var/lib/postgresql/18/docker), so mount the parent directory.
      - dsv-db-data:/var/lib/postgresql
      # Run once, on an empty volume. Migrations aren't mounted: deploy.sh
      # and pipeline.sh apply src/dsv-db/migrations/ before every load.
      - ./src/dsv-db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./src/dsv-db/set-passwords.sh:/docker-entrypoint-initdb.d/set-passwords.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DSV_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Data pipeline: Toronto Open Data -> Blob raw zone -> Postgres. One-shot,
  # run only by scripts/pipeline.sh, which mounts the storage token and
  # passes the subcommand (ingest, load, or run). The profile keeps
  # `docker compose up` from ever starting it, so restarts never touch data.
  dsv-pipeline:
    build: ./src/dsv-pipeline
    profiles: [pipeline]
    environment:
      <<: *db-env
      DSV_DB_USER: dinesafe_migrator
      DSV_DB_PASSWORD: ${DSV_DB_MIGRATOR_PASSWORD:-dinesafe_migrator}
    depends_on:
      dsv-db:
        condition: service_healthy
    restart: "no"

  dsv-analytics:
    # Bundles the PostgreSQL plugin (13.0.4); the -slim variant doesn't.
    # See docs/ref/app-notes.md.
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    ports:
      - "3000:3000"
    environment:
      GF_SERVER_ROOT_URL: ${DSV_ANALYTICS_ROOT_URL:-http://localhost:8080/analytics/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${DSV_ANALYTICS_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${DSV_ANALYTICS_ADMIN_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/dinesafe.json
      # Use the plugins in the image; don't download them from grafana.com.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      <<: *db-app-env
    volumes:
      - ./src/dsv-analytics/provisioning:/etc/grafana/provisioning
      - dsv-analytics-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/analytics/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
    depends_on:
      dsv-db:
        condition: service_healthy

volumes:
  dsv-db-data:
  dsv-analytics-data:
