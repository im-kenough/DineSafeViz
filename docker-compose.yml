services:
  db:
    image: postgres:17.9
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./src/db/Dinesafe.csv:/data/Dinesafe.csv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinesafe"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./src/web
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      grafana:
        condition: service_started

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      # Exposed for direct admin access. Navigate to localhost:3000/grafana/ to log in.
      # The public-facing embed still runs through the Flask proxy (anonymous, no port needed).
      - "3000:3000"
    environment:
      # Sub-path config — required for the Flask proxy at /grafana/ to work correctly.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:5000/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

      # Admin credentials — set these in your .env file (see .env.example).
      # Only applied on first boot; changing them after requires wiping Grafana's internal DB.
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}

      # Anonymous viewer access — keeps the embedded dashboard working without login.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer

      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/dinesafe.json
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./src/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
