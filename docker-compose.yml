services:
  db:
    image: postgres:17.9
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./src/db/Dinesafe.csv:/data/Dinesafe.csv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinesafe"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./src/web
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
