# infra/ansible/ansible.cfg
[defaults]
inventory = inventory/hosts.yml
remote_user = adm-ubuntu
private_key_file = ~/.ssh/iac
host_key_checking = False
retry_files_enabled = False
roles_path = roles

[ssh_connection]
ssh_args = -o IdentitiesOnly=yes

[privilege_escalation]
become = True
become_method = sudo
become_user = root
