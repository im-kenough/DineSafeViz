# infra/ansible/roles/deploy/tasks/main.yml
---
- name: Wait for SSH connectivity
  wait_for_connection:
    timeout: 120

- name: Check if repo exists
  stat:
    path: "{{ app_dir }}/.git"
  register: repo_check

- name: Clone repo (fresh deploy)
  git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_branch }}"
    accept_hostkey: true
  become: false
  when: not repo_check.stat.exists

- name: Pull latest code (existing deploy)
  git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_branch }}"
    update: true
  become: false
  when: repo_check.stat.exists

- name: Template .env file from vault secrets
  template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ service_account }}"
    group: "{{ service_account }}"
    mode: "0600"

- name: Start application with Docker Compose
  command: docker compose up -d --build
  args:
    chdir: "{{ app_dir }}"
  become: false
  changed_when: true

- name: Wait for Flask app to respond
  uri:
    url: "http://{{ vm_ip }}:5000/"
    status_code: 200
  register: health_check
  retries: 30
  delay: 10
  until: health_check.status == 200
