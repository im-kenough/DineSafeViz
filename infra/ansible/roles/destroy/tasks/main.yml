# infra/ansible/roles/destroy/tasks/main.yml
---
- name: Check if app directory exists
  stat:
    path: "{{ app_dir }}/docker-compose.yml"
  register: compose_check

- name: Stop and remove containers
  command: "docker compose down{{ '' if (keep_data | default(false) | bool) else ' -v' }}"
  args:
    chdir: "{{ app_dir }}"
  become: false
  when: compose_check.stat.exists
  changed_when: true

- name: Remove app directory
  file:
    path: "{{ app_dir }}"
    state: absent

- name: Prune unused Docker images
  command: docker image prune -af
  become: false
  changed_when: true
