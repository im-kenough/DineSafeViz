# infra/ansible/group_vars/all.yml
#
# Centralized non-secret configuration for all IaC operations.
# Secrets live in vault/secrets.yml (Ansible Vault encrypted).

# --- Proxmox ---
proxmox_api_url: "https://10.0.20.21:8006"
proxmox_node: "{{ vault_proxmox_node }}"  # from vault/secrets.yml
proxmox_storage: "local-lvm"
proxmox_bridge: "vmbr0"

# --- Network ---
network_gateway: "10.0.20.1"
network_dns: "10.0.20.1"
network_cidr: "/24"

# --- Template IDs ---
template_cloud_image: 9000
template_ubuntu_base: 9100
template_ubuntu_docker: 9101
template_dsv_app: 9102

# --- Target VM ---
vm_name: "yyz-app-dsv01"
vm_ip: "10.0.20.80"
vm_cpu: 2
vm_memory: 4096
vm_disk_size: 60
vm_timezone: "America/Toronto"

# --- Service Account ---
service_account: "adm-ubuntu"

# --- Application ---
app_dir: "/home/adm-ubuntu/app/DineSafeViz"
app_repo: "git@github.com:im-kenough/DineSafeViz.git"
app_branch: "main"

# --- Docker ---
docker_log_max_size: "10m"
docker_log_max_file: "3"
