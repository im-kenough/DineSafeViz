# ============================================================================
# Ansible Vault secrets — EXAMPLE TEMPLATE
#
# Copy this file to `secrets.yml`, replace every REPLACE_WITH_* placeholder
# with a real value, and encrypt it:
#
#     cp example-secrets.yml secrets.yml
#     ansible-vault encrypt secrets.yml
#
# (or create it directly with `ansible-vault create secrets.yml`).
#
# This file holds ONLY secrets. Non-secret identifiers — the Proxmox token IDs,
# database usernames, database name, and the Grafana admin username — live in
# plaintext in `group_vars/all.yml`, NOT here.
#
# These key names must match exactly what the deploy code consumes:
#   - render-vars.py  reads the Proxmox token secrets and the deploy key.
#   - roles/deploy/templates/env.j2  reads the database and Grafana passwords.
# See docs/explanation/6-security-architecture.md for the full identity inventory.
# ============================================================================

# --- Proxmox API token secrets ---
# The secret half of each Proxmox API token. The matching token IDs are set in
# group_vars/all.yml (proxmox_api_terraform_token_id, proxmox_api_packer_token_id).

# Authenticates Terraform to the Proxmox API for VM provisioning.
vault_proxmox_api_token_secret: "REPLACE_WITH_TERRAFORM_TOKEN_SECRET"

# Authenticates Packer to the Proxmox API for image builds.
vault_packer_api_token_secret: "REPLACE_WITH_PACKER_TOKEN_SECRET"

# --- PostgreSQL passwords ---

# Password for the `dinesafe` superuser role, which creates the schema and
# ingests data through dsv-init-db. Rendered into .env as DSV_DB_PASSWORD.
vault_db_password: "REPLACE_WITH_DB_SUPERUSER_PASSWORD"

# Password for the SELECT-only `dinesafe_app` role that the Flask app and
# Grafana use to read data. Rendered into .env as DSV_DB_APP_PASSWORD.
# Optional: env.j2 defaults it to "dinesafe_app" if unset. Set it explicitly.
vault_db_app_password: "REPLACE_WITH_DB_APP_PASSWORD"

# --- Grafana admin password ---
# Password for the Grafana `admin` user (username is in group_vars/all.yml).
# Rendered into .env as DSV_ANALYTICS_ADMIN_PASSWORD.
vault_analytics_admin_password: "REPLACE_WITH_GRAFANA_ADMIN_PASSWORD"

# --- GitHub deploy key ---
# Private half of the read-only ed25519 GitHub deploy key used to clone the
# repository onto the VM during the Packer dsv-app build.
vault_github_deploy_keys: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  REPLACE_WITH_DEPLOY_KEY_PRIVATE_KEY
  -----END OPENSSH PRIVATE KEY-----
