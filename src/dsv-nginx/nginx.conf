events {}

http {
    server_tokens off;

    # Behind Cloudflare Tunnel, $remote_addr is cloudflared. The visitor's
    # address is in CF-Connecting-IP, which is empty for local requests.
    log_format cf '$remote_addr cf=$http_cf_connecting_ip - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log cf;

    # Connection: upgrade only on WebSocket requests; otherwise close so non-WS
    # traffic to Grafana keeps HTTP/1.1 keepalive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # /search is the slowest route; a burst could take all 4 gunicorn threads
    # (#348). Limit it per visitor: CF-Connecting-IP behind the tunnel, else
    # $remote_addr. On the VM nginx is reachable only through cloudflared and
    # Cloudflare's edge sets the header; locally (port 8080) it can be spoofed,
    # which is fine for dev. A map, not real_ip_header, so $remote_addr, the
    # access log and X-Real-IP keep their meaning.
    map $http_cf_connecting_ip $search_client {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }
    # Limits (#348): 2 searches/s, burst 10 (limit_req in /search). Far above a person
    # typing, so only scripts hit 429.
    limit_req_zone $search_client zone=search:1m rate=2r/s;

    # CSP for the Flask pages. Grafana (/analytics/) runs inline scripts, so it
    # gets none: add_header skips a header whose value is empty.
    # img-src: map tiles from OpenStreetMap, data: images from Leaflet.
    # style-src 'unsafe-inline': the templates have <style> blocks.
    map $uri $content_security_policy {
        ~^/analytics/ "";
        default       "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
    }

    # Inspections pages are large HTML; text/html is always included once on.
    gzip       on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Re-resolve container names through Docker's DNS. A plain proxy_pass to a
    # hostname resolves once at startup, so recreating dsv-app (new image, new
    # IP) left nginx sending to the old address: 502 while the app is healthy.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream app {
        zone app 64k;
        server dsv-app:8000 resolve;
    }

    upstream analytics {
        zone analytics 64k;
        server dsv-analytics:3000 resolve;
    }

    server {
        listen 80;

        # VM-only rules. docker-compose.vm.yml mounts this directory; locally
        # it doesn't exist and the include matches nothing.
        include /etc/nginx/snippets/*.conf;

        # Security headers on every response. Inherited only by locations
        # that set no add_header of their own, so keep add_header out of them.
        # HSTS is 5 minutes while we check nothing breaks; raise it to
        # 31536000 (1 year) once stg and prod are fine.
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        add_header Content-Security-Policy $content_security_policy always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Inherited by every location that sets no proxy_set_header of its own.
        # /analytics/ adds WebSocket headers, so it must repeat these.
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        location /analytics/ {
            proxy_pass         http://analytics;
            # Grafana sends its own; nginx adds it for every route.
            proxy_hide_header  X-Content-Type-Options;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /search {
            limit_req          zone=search burst=10 nodelay;
            limit_req_status   429;
            proxy_pass         http://app;
        }

        location / {
            proxy_pass         http://app;
        }
    }
}
