# **Not a workflow** — this is the configuration file consumed by the `release-drafter` github action.

# Sets the draft's title and tag to `v$RESOLVED_VERSION`
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Maps PR labels → section headings in the release body and semver bump priority (major > minor > patch)
# Per semantic versioning, major increments 1.x.x, minor increments x.1.x, patch increments x.x.1
categories:
  - title: '🔒 Security'
    semver-increment: 'patch'
    when:
      labels:
        - 'infosec'

  - title: '🚀 Features'
    semver-increment: 'minor'
    when:
      labels:
        - 'feature'
        - 'enhancement'

  - title: '🎨 UI'
    when:
      labels:
        - 'ui'

  - title: '🐛 Bug Fixes'
    semver-increment: 'patch'
    when:
      labels:
        - 'bug'
        - 'fix'

  - title: '🏎️ Performance'
    when:
      labels:
        - 'perf'

  - title: '🏗️ Infrastructure'
    when:
      labels:
        - 'infra'
        - 'iac'
        - 'ops'
        - 'dr'
        - 'db'

  - title: '⚙️ CI/CD'
    when:
      labels:
        - 'ci-cd'
        - 'github_actions'

  - title: '📚 Documentation'
    when:
      labels:
        - 'documentation'

  - title: '🔧 Maintenance'
    when:
      labels:
        - 'refactor'
        - 'chore'

  # Dependabot creates a lot of noise, keep it at the bottom
  - title: '🪜 Dependencies'
    when:
      labels:
        - 'dependencies'
        - 'python'
        - 'docker'

  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      labels:
        - 'major'
        - 'breaking'

# Format for each changelog entry
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.

# Release body template
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
