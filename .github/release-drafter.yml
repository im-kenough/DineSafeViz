name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '⚙️ CI/CD'
    labels:
      - 'ci-cd'
  - title: '🔨 Build & Dependencies'
    labels:
      - 'build'
      - 'dependencies'
  - title: '📚 Documentation'
    labels:
      - 'documentation'

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.      
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'fix'
template: |
  ## What's Changed

  $CHANGES

  ## Deployment Notes

  - [Install guide](docs/ref/deploy/install.md)
  - [Deployment guide](docs/ref/deploy/deploy.md)

  ## Rollback Instructions

  - Rollback guide - TBD

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
