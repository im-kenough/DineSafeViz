# **Not a workflow** — this is the configuration file consumed by the `release-drafter` github action.

# Sets the draft's title and tag to `v$RESOLVED_VERSION`
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Maps PR labels → section headings in the release body
categories:
  - title: '🔒 Security'
    labels:
      - 'infosec'
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🎨 UI'
    labels:
      - 'ui'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '🏗️ Infrastructure'
    labels:
      - 'infra'
      - 'iac'
      - 'ops'
      - 'dr'
      - 'db'
  - title: '⚙️ CI/CD'
    labels:
      - 'ci-cd'
      - 'github_actions'
  - title: '🔨 Build & Dependencies'
    labels:
      - 'build'
      - 'dependencies'
      - 'python'
      - 'docker'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
  - title: '🔧 Maintenance'
    labels:
      - 'refactor'
      - 'chore'

# Format for each changelog entry
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.      

# Maps labels to semver bump priority (major > minor > patch)
# Per semantic versioning, major increments 1.x.x, minor increments x.1.x, patch increments x.x.1
# So make sure a PR has t least a label of type minor (feature, enhancement) to increment x.1.x
# and at least a label of type patch (bug, fix, infosec) to increment x.x.1
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'fix'
      - 'infosec'

# The full Markdown body template including deployment notes, PIV, and rollback sections
template: |
  ## What's Changed

  $CHANGES

  ## Deployment Notes

  - [Install guide](docs/how-to/1-install/README.md): How to provision and install DineSafeViz.
  - [Deployment guide](docs/how-to/1-install/6-deploy.md): How to deploy DineSafeViz on existing infrastructure.
  - [Administration guide](docs/how-to/5-administer.md): How to configure and manage DineSafeViz.

  ## Post Implementation Verification (PIV)

  - [PIV guide](docs/how-to/3-verify-a-deployment.md): How to verify DineSafeViz is working as expected after deployment.

  ## Rollback Instructions

  - Rollback guide - TBD

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
