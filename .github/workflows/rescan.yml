# Weekly (or manual): rescan the deployed GHCR tags and the pinned upstream
# images for newly published vulnerabilities, and report them to
# Security > Code scanning. Builds and publishing live in images.yml.
# Details: docs/explanation/azure-vm/ci-cd.md
name: Rescan images

on:
  schedule:
    - cron: "17 6 * * 1" # Run at 6:17am on Mondays
  workflow_dispatch:

permissions:
  contents: read

env:
  # GHCR names must be lowercase, so the owner is spelled out.
  REGISTRY: ghcr.io/im-kenough

jobs:
  list-images:
    name: Rescan - list deployed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List owned tags and pinned upstream images
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          {
            # Pinned upstream images; lines with ${...} are the owned images.
            sed -nE 's/^\s+image:\s*([^$[:space:]]+)\s*$/\1/p' docker-compose.yml docker-compose.vm.yml
            for image in dsv-app dsv-pipeline; do
              echo "$REGISTRY/$image:main"
              # v0.4.0 predates this workflow and has no images. Once a later
              # release is published, make a missing image fail this job.
              if [ -n "$release" ]; then
                ref="$REGISTRY/$image:${release#v}"
                if docker manifest inspect "$ref" >/dev/null 2>&1; then
                  echo "$ref"
                else
                  echo "::warning::$ref not found in GHCR; skipping rescan" >&2
                fi
              fi
            done
          } | sort -u | jq -Rnc '"images=" + ([inputs] | tojson)' -r >> "$GITHUB_OUTPUT"

  rescan:
    name: Rescan (${{ matrix.image }})
    needs: list-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list-images.outputs.images) }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The category must survive pin bumps, or each new tag/digest opens a
      # fresh category and the previous pin's alerts are never closed.
      - name: Derive code scanning category
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          ref=${IMAGE%@*}
          repo=${ref%:*}
          [ "${ref##*:}" = main ] && repo+=-main
          echo "slug=${repo//[\/:]/-}" >> "$GITHUB_OUTPUT"
      - name: Trivy report, all severities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - name: Upload report to Security > Code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: rescan-${{ steps.name.outputs.slug }}
