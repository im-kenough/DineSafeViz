# Checks, builds, and publishes the two owned images (dsv-app, dsv-pipeline).
# Every pull request, push to main, and v* tag runs lint, tests, and an image
# build and scan. Pushes also publish to GHCR once all of those pass, and a v*
# tag then publishes the matching draft release.
# Tags: main gets `main` and `sha-<7>`; v* tags get `X.Y.Z` and `X.Y`.
# CodeQL and the full Trivy IaC report are in code-scanning.yml, and the weekly
# rescan of published images is in rescan-images.yml.
# Details: docs/explanation/azure-vm/ci-cd.md
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  # GHCR names must be lowercase, so the owner is spelled out.
  REGISTRY: ghcr.io/im-kenough

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for gitleaks, so a secret added and then deleted in
          # a later commit is still caught.
          fetch-depth: 0
      # No pip cache: this workflow publishes images, and a poisoned cache
      # could pass checks that gate the push. Installs take seconds anyway.
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install lint tools
        run: pip install -r requirements-ci.txt
      - name: Lint Python (Ruff, with Bandit security rules)
        run: ruff check --output-format github .
      - name: Lint shell scripts (shellcheck)
        run: git ls-files -z '*.sh' 'tests/fakes/*' | xargs -0 shellcheck
      - name: Lint YAML (yamllint)
        run: yamllint --format github .
      - name: Lint workflows (actionlint)
        run: actionlint -color
      # Security audit of the workflows and dependabot.yml: template injection,
      # over-broad permissions, persisted credentials, unpinned actions. The
      # token turns on the online audits (impostor commits, known-vulnerable
      # actions). To accept a finding, add a .github/zizmor.yml
      # (https://docs.zizmor.sh/configuration/).
      - name: Audit workflow security (zizmor)
        run: zizmor --format github .
        env:
          GH_TOKEN: ${{ github.token }}
      # Same digest pinning as hadolint below. Accepted false positives are
      # fingerprinted in .gitleaksignore. Actions sets HOME=/github/home, so
      # the image's /root/.gitconfig is ignored and git refuses the
      # runner-owned checkout; without safe.directory it scans 0 commits and
      # still passes.
      - name: Scan git history for secrets (gitleaks)
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --no-banner --verbose .
      # Terraform and Dockerfile misconfigurations. Only CRITICAL blocks the
      # merge (and so the image push); code-scanning.yml reports everything.
      - name: Fail on CRITICAL IaC misconfigurations (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
      # Official prebuilt image, pinned by digest. It has no entrypoint, so the
      # binary is named in args. Dependabot only updates action refs, not
      # docker:// images, so bump this one by hand. Info-level notes print in
      # the log but don't fail the job.
      - name: Lint Dockerfiles (hadolint)
        uses: docker://ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
        with:
          args: >-
            /bin/hadolint --failure-threshold warning
            src/dsv-app/Dockerfile src/dsv-pipeline/Dockerfile

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install app, pipeline, and test dependencies
        run: >-
          pip install
          -r src/dsv-app/requirements.txt
          -r src/dsv-app/requirements-dev.txt
          -r src/dsv-pipeline/requirements.txt
      # Separate runs: each suite has its own conftest.py and helper modules.
      # The DB tests start the real Postgres image.
      - name: Test deploy, Compose, and DB (tests/)
        run: pytest tests
      - name: Test dsv-app
        run: pytest src/dsv-app/tests
      - name: Test dsv-pipeline
        run: pytest src/dsv-pipeline/tests

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on new high or critical vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  build-scan:
    name: Build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [dsv-app, dsv-pipeline]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # publish-images pushes from this layer cache, so it ships the image
      # scanned here rather than a fresh build.
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/${{ matrix.image }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Pull requests skip the report; the gate below prints a table instead.
      - name: Report all vulnerabilities (Trivy)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          exit-code: "0"
      - name: Upload report to Security > Code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: image-${{ matrix.image }}
      - name: Fail on fixable CRITICAL vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish-images:
    name: Publish images
    # Nothing reaches GHCR unless lint, tests, and both image scans pass, even
    # for a v* tag on a commit that never went through a PR.
    needs: [lint, test, build-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [dsv-app, dsv-pipeline]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push ${{ matrix.image }} (from the build-scan cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}

  publish-release:
    name: Publish release
    # Waits for both images, so a public release always has them. A separate
    # job keeps contents: write away from the image builds.
    needs: publish-images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Finds the draft by tag name; fails if no matching release exists.
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
