# On every push to main, rebuilds the single draft release with categorized
# notes for all PRs merged since the last published tag. Version, title, tag,
# and body all come from .github/release-drafter.yml; ci.yml publishes
# the draft when the matching v* tag is pushed.
# No pull_request trigger: on PR refs the action only does a dry run, and
# there's no autolabeler config.
name: Release drafter

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update-draft:
    name: Update draft release
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # The action's `token` input defaults to github.token.
      - name: Rebuild draft release notes
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
