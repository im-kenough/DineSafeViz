# Triggers: push of a tag matching `v*`.
# What it does: Queries the GitHub API for a draft release whose `tag_name` matches the pushed tag. 
# If found, it PATCHes the release to `draft: false` (publishing it). If no matching draft exists, 
# the workflow fails with an error.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.draft == true and .tag_name == \"$TAG\") | .id")

          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              --method PATCH \
              --field draft=false
            echo "Published draft release $RELEASE_ID for tag $TAG"
          else
            echo "::error::No draft release found for tag $TAG"
            exit 1
          fi
