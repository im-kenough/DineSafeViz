# Triggers: push of a tag matching `v*`.
# What it does: publishes the draft release whose tag matches the pushed tag.
# `gh release edit` finds drafts by tag name and exits non-zero (failing the
# workflow) if no matching release exists.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
