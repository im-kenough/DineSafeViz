# Automatically opens PRs with the `dependencies` label to bump outdated dependencies on a schedule

# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Every ecosystem waits 7 days before proposing a new release, so a hijacked
# version is likely pulled before Dependabot picks it up. Security updates
# ignore cooldown and still open immediately.

version: 2

updates:
  # Python packages in the webapp, the data pipeline, and the CI lint tools
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/src/dsv-app"
      - "/src/dsv-pipeline"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  # Dockerfile base images in the webapp and the data pipeline
  - package-ecosystem: "docker"
    directories:
      - "/src/dsv-app"
      - "/src/dsv-pipeline"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]

  # Upstream images pinned in the Compose files. Postgres major versions need
  # a data migration, not just a new tag, so they're ignored.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compose-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # Update GitHub Actions versions in workflows files
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
