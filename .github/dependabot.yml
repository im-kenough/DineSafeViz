# Automatically opens PRs with the `dependencies` label to bump outdated dependencies on a schedule

# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Every ecosystem waits 7 days before proposing a new release, so a hijacked
# version is likely pulled before Dependabot picks it up. Security updates
# ignore cooldown and still open immediately.

version: 2

updates:
  # Python packages in the webapp, the data pipeline, and the CI lint tools
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/src/dsv-app"
      - "/src/dsv-pipeline"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  # Dockerfile base images in the webapp and the data pipeline
  - package-ecosystem: "docker"
    directories:
      - "/src/dsv-app"
      - "/src/dsv-pipeline"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    # The project standardizes on Python 3.14.* (docs-new/ref/20-dependencies.md),
    # so only patch releases come through.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Upstream images pinned in the Compose files. Postgres major versions need
  # a data migration, not just a new tag, so they're ignored. Grafana and
  # nginx majors need a manual review of breaking changes.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compose-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "grafana/grafana"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major"]

  # Terraform providers and lock files for both stacks. Provider majors have
  # breaking changes, so they're ignored.
  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/landing-zone"
      - "/infra/rug/terraform"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      terraform-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Hook revisions in .pre-commit-config.yaml (gitleaks, pre-commit-hooks)
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pre-commit-minor-patch:
        update-types: ["minor", "patch"]

  # Update GitHub Actions versions in workflows files
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
