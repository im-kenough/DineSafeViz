# Automatically opens PRs with the `dependencies` label to bump outdated dependencies on a schedule

# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Python packages in the webapp and the data loader
  - package-ecosystem: "pip"
    directories:
      - "/src/dsv-app"
      - "/src/dsv-db"
    target-branch: "main"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  # Dockerfile base images in the webapp and the data loader
  - package-ecosystem: "docker"
    directories:
      - "/src/dsv-app"
      - "/src/dsv-db"
    target-branch: "main"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]

  # Upstream images pinned in the Compose files. Postgres major versions need
  # a data migration, not just a new tag, so they're ignored.
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    groups:
      compose-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # Update GitHub Actions versions in workflows files
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
