# zizmor config (GitHub workflow security audit, run in ci.yml).
# Docs: https://docs.zizmor.sh/configuration/
rules:
  # images.yml calls ci.yml as ./.github/workflows/ci.yml. zizmor prefers the
  # newer $/ self-repository syntax, but a reusable workflow called with ./
  # always resolves to the caller's own commit, so this low-severity finding
  # doesn't apply here.
  self-repository:
    ignore:
      - images.yml
